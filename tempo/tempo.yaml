auth_enabled: false

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 30s
  max_block_duration: 30m

compactor:
  compaction:
    # 보존 기간은 S3 Lifecycle로 관리하는 것을 권장하지만,
    # 간단히 데모 용으로 짧게 유지하려면 아래 retention 옵션을 사용
    block_retention: 24h

storage:
  trace:
    backend: s3
    s3:
      bucket: muzlive-loki-chunks
      region: ap-northeast-2
      endpoint: s3.ap-northeast-2.amazonaws.com
      prefix: tempo-prod/
    wal:
      path: /var/tempo/wal
query_frontend:
  max_outstanding_per_tenant: 2048

metrics_generator:
  processor:
    service_graphs: {}
    span_metrics:
      dimensions: [http.method, http.target, http.status_code]
  storage:
    path: /tmp/tempo/metrics-generator
    remote_write:
      - url: http://mimir:9009/api/v1/push
