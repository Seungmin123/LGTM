apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki-ds
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      derivedFields:
        - name: trace_id
          matcherRegex: 'trace_id=([\w-]+)'
          url: '$${__value.raw}'
          datasourceUid: tempo-ds

  - name: Mimir
    type: prometheus
    uid: mimir-ds
    access: proxy
    url: http://mimir:9009/prometheus
    isDefault: true
    jsonData:
      timeInterval: "60s"  # Micrometer OTLP push 주기. 미설정 시 Grafana가 15s로 가정해 $__rate_interval 창이 좁아져 rate 패널이 No Data가 됨

  - name: Tempo
    type: tempo
    uid: tempo-ds
    access: proxy
    url: http://tempo:3200
    isDefault: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki-ds
        spanStartTimeShift: '5m'
        spanEndTimeShift: '5m'
        filterByTraceID: true
        filterBySpanID: false