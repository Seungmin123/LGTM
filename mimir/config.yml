multitenancy_enabled: false

server:
  http_listen_port: 9009

distributor:
  ring:
    kvstore:
      store: inmemory

ingester:
  ring:
    kvstore:
      store: inmemory
    replication_factor: 1

blocks_storage:
  backend: s3
  storage_prefix: mimir-prod  # 버킷 내 mimir 전용 경로 (s3.prefix는 존재하지 않는 필드)
  s3:
    bucket_name: muzlive-loki-chunks
    region: ap-northeast-2
    endpoint: s3.ap-northeast-2.amazonaws.com
  tsdb:
    dir: /data/tsdb  # ingester 로컬 WAL (단기 버퍼, 영속 불필요)
    retention_period: 4h  # S3 업로드 완료된 로컬 블록 보관 시간 (기본 13h)
    wal_compression_enabled: true

compactor:
  data_dir: /data/compactor  # 컴팩션 임시 작업 디렉터리 (영속 불필요)
  sharding_ring:
    kvstore:
      store: inmemory

ruler:
  enable_api: true
  rule_path: /data/rules

limits:
  ingestion_rate: 10000
  ingestion_burst_size: 20000
  max_global_series_per_user: 100000
  max_global_series_per_metric: 5000
  compactor_blocks_retention_period: 90d
